name: Client App CI/CD Trigger

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  shipops-deploy:
    name: Trigger ShipOps Cloud-Native Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Trigger ShipOps Pipeline
        env:
          SHIPOPS_SERVER_URL: ${{ secrets.SHIPOPS_SERVER_URL || 'https://shipops.internal' }}
          SHIPOPS_WEBHOOK_SECRET: ${{ secrets.SHIPOPS_WEBHOOK_SECRET || 'shipops-secret-token-12345' }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "repository": {
              "name": "${{ github.event.repository.name }}",
              "clone_url": "${{ github.event.repository.clone_url }}"
            },
            "ref": "${{ github.ref }}",
            "head_commit": {
              "id": "${{ github.sha }}",
              "message": "${{ github.event.head_commit.message }}",
              "author": { "name": "${{ github.actor }}" }
            }
          }
          EOF
          )
          
          # Calculate HMAC SHA-256 signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SHIPOPS_WEBHOOK_SECRET" | sed 's/^.* //')
          
          echo "Sending deployment trigger to ShipOps at $SHIPOPS_SERVER_URL/api/webhooks/github..."
          curl -X POST "$SHIPOPS_SERVER_URL/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
