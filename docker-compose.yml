services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipops-platform
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=shipops
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GITHUB_WEBHOOK_SECRET=shipops-secret-token-12345
      - DOCKER_REGISTRY=registry.shipops.internal
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shipops-network

  postgres:
    image: postgres:16-alpine
    container_name: shipops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shipops-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: shipops-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - shipops-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shipops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cicd-platform.json
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shipops-network

networks:
  shipops-network:
    driver: bridge

volumes:
  pgdata:
  promdata:
  grafanadata:
