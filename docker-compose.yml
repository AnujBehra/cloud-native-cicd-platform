services:
  app:
    build: .
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://cicd:cicd@postgres:5432/cicd
      PIPELINE_MODE: real
      DOCKER_REGISTRY: local
      PUSH_IMAGES: "false"
      SECURITY_SCAN_ENABLED: "true"
      SECURITY_SCAN_FAIL_ON_FINDINGS: "false"
      PIPELINE_CONCURRENCY: "1"
      KUBE_NAMESPACE: apps
      HELM_RELEASE_PREFIX: app
      GIT_AUTH_TOKEN: ${GIT_AUTH_TOKEN:-}
      APP_CHART_PATH: ./helm/deployed-app
      KUBECONFIG: /tmp/kubeconfig
      KUBE_CONTEXT: docker-desktop
      API_KEY: local-dev-secret
      GITHUB_WEBHOOK_SECRET: local-webhook-secret
      CORS_ORIGIN: http://localhost:3003
      LOG_LEVEL: info
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/host-kube:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "cp /host-kube/config /tmp/kubeconfig 2>/dev/null || true;
      if [ -f /tmp/kubeconfig ]; then kubectl config set-cluster docker-desktop --server=https://host.docker.internal:6443 --insecure-skip-tls-verify=true --kubeconfig=/tmp/kubeconfig >/dev/null 2>&1 || true; fi;
      node src/migrate.js && node src/index.js"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd
      POSTGRES_DB: cicd
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicd -d cicd"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3004:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
