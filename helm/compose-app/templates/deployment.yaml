{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "compose-app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          {{- if .env }}
          env:
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .readinessPath }}
          readinessProbe:
            httpGet:
              path: {{ .readinessPath }}
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: {{ .livenessPath | default .readinessPath }}
              port: {{ .port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
