replicaCount: 2

serviceAccount:
  create: true
  name: ""

image:
  repository: ghcr.io/example/cloud-native-cicd-platform
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

env:
  pipelineMode: simulate
  dockerRegistry: ghcr.io/example
  pushImages: false
  securityScanEnabled: true
  securityScanFailOnFindings: false
  pipelineConcurrency: 1
  kubeNamespace: apps
  gitAuthTokenSecretName: ""
  gitAuthTokenSecretKey: GIT_AUTH_TOKEN
  corsOrigin: "*"
  logLevel: info

database:
  urlSecretName: cicd-platform-db
  urlSecretKey: DATABASE_URL

api:
  keySecretName: cicd-platform-api
  keySecretKey: API_KEY

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 10s

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
